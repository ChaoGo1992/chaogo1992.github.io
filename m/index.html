<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#FDFBF6">
<title>育儿日记</title>
<link rel="manifest" href="/static/m/manifest.json">
<link rel="icon" href="/static/m/icons/icon-192.png">
<link rel="apple-touch-icon" href="/static/m/icons/icon-192.png">
<link rel="stylesheet" href="/static/m/m_style.css?v=20261105b">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">育儿日记</div>
    <div class="m-age" id="m-age">宝宝</div>
    <span class="sp"></span>
    <div class="offline">离线可用</div>
  </header>

  <div class="views">
    <!-- 写日记 -->
    <div class="view on" id="view-write">
      <div class="composer">
        <div class="hint">
          <input type="date" id="m-date">
          <span class="date-note" id="composer-date-text">今天</span>
        </div>
        <input type="text" id="m-title" placeholder="标题（如：第一次叫妈妈）">
        <textarea id="m-body" placeholder="正文直接书写，随时拍照/相册插图…"></textarea>
        <input type="text" id="m-tags" placeholder="标签，逗号分隔（如：里程碑, 语言）">
        <div class="photo-zone">
          <div class="drop">
            <button class="abtn tiny" id="btn-capture">📷 拍照</button>
            <span class="bar">|</span>
            <button class="abtn tiny" id="btn-gallery">🖼 相册</button>
            <span class="hint-text">自动压缩长边2000px</span>
          </div>
          <input type="file" id="input-capture" accept="image/*" capture="environment" hidden>
          <input type="file" id="input-gallery" accept="image/*" multiple hidden>
          <div class="thumb-strip" id="thumb-strip"></div>
        </div>
        <div class="foot-row">
          <button class="abtn" id="btn-new">新篇</button>
          <button class="abtn dark" id="btn-save">存入日记</button>
        </div>
      </div>
    </div>

    <!-- 日记列表 -->
    <div class="view" id="view-list">
      <div class="filter-bar">
        <select id="f-year"></select>
        <select id="f-month"></select>
        <span class="f-count" id="f-count"></span>
      </div>
      <div id="list-body"></div>
    </div>

    <!-- 导出/设置 -->
    <div class="view" id="view-export">
      <div class="panel">
        <h4>回传 PC（导出后 PC 端一键导入，自动增量去重）</h4>
        <div class="exp-row">
          <div class="exp-item" id="btn-export-all">
            <span class="ic">📦</span>
            <div class="desc"><b>导出全部 zip</b><div class="d2">所有日记 + 照片打包 · PC 导入增量去重</div></div>
            <span class="arr">&rsaquo;</span>
          </div>
          <div class="exp-item month-row">
            <span class="ic">📅</span>
            <div class="desc">
              <b>按月导出 zip</b>
              <div class="d2"><select id="export-month"></select></div>
            </div>
            <button class="abtn tiny" id="btn-export-month">导出</button>
          </div>
        </div>
      </div>

      <div class="panel">
        <h4>全量备份</h4>
        <div class="exp-row">
          <div class="exp-item" id="btn-export-all-again">
            <span class="ic">💾</span>
            <div class="desc"><b>导出全部数据</b><div class="d2">建议每周一次，存到手机或发微信收藏</div></div>
            <span class="arr">&rsaquo;</span>
          </div>
        </div>
      </div>

      <div class="panel">
        <h4>宝宝信息</h4>
        <div class="field"><label>昵称</label><input type="text" id="set-name"></div>
        <div class="field"><label>生日</label><input type="date" id="set-birthday"></div>
        <button class="abtn dark" id="btn-save-settings" style="width:100%">保存</button>
      </div>

      <div class="warn-box">
        ⚠️ 手机端数据存本机浏览器存储。请<b>定期导出备份</b>，避免清理浏览器数据时丢失。回传 PC 后即有双保险。
      </div>

      <div style="text-align:center;margin-top:16px;">
        <span class="desktop-link" style="color:var(--faint);font-size:11px">PWA</span>
      </div>
    </div>
  </div>

  <!-- 裁切弹窗 -->
  <div class="modal hidden" id="crop-modal">
    <div class="sheet">
      <h3>调整照片</h3>
      <div class="sub">原图保留 · 只记录显示参数（与 PC 端同一套规则）</div>
      <div class="crop-stage" id="crop-stage">
        <img id="crop-img" src="" alt="crop">
        <div class="crop-box" id="crop-box">
          <div class="handle nw" data-h="nw"></div>
          <div class="handle ne" data-h="ne"></div>
          <div class="handle sw" data-h="sw"></div>
          <div class="handle se" data-h="se"></div>
        </div>
      </div>
      <div class="crop-acts">
        <button class="abtn tiny" id="btn-crop-rotate">↻ 旋转 <span id="crop-angle">0°</span></button>
        <button class="abtn tiny" id="btn-crop-reset">重置</button>
        <span class="sp"></span>
        <button class="abtn dark tiny" id="btn-crop-confirm">确定</button>
        <button class="abtn tiny" id="btn-crop-cancel">取消</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <nav class="tabbar">
    <button class="on" data-v="view-write"><span class="ic">✍️</span>写日记</button>
    <button data-v="view-list"><span class="ic">📖</span>日记</button>
    <button data-v="view-export"><span class="ic">📤</span>导出</button>
  </nav>
</div>

<script src="/static/m/idb.js?v=20261105b"></script>
<script src="/static/m/vendor/jszip.min.js?v=20261105b"></script>
<script src="/static/m/m_app.js?v=20261105b"></script>
</body>
</html>
